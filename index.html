<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>K1 Kitchen Spelling Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', '微軟正黑體', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            background-color: #fff1f2;
            background-image: radial-gradient(#fecdd3 2px, transparent 2px);
            background-size: 30px 30px;
            overflow: hidden;
        }

        .btn-3d {
            transition: all 0.1s;
            box-shadow: 0 6px 0px rgba(0,0,0,0.2);
        }
        .btn-3d:active:not(:disabled) {
            transform: translateY(6px);
            box-shadow: 0 0px 0px rgba(0,0,0,0.2);
        }
        .btn-3d:disabled {
            opacity: 0.5;
            transform: translateY(6px);
            box-shadow: 0 0px 0px rgba(0,0,0,0.2);
            cursor: not-allowed;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px) rotate(-5deg); }
            40%, 80% { transform: translateX(10px) rotate(5deg); }
        }
        .animate-shake { animation: shake 0.5s ease-in-out; }

        @keyframes dropIntoPot {
            0% { transform: scale(1) translateY(0) rotate(0deg); opacity: 1; }
            50% { transform: scale(1.5) translateY(-50px) rotate(15deg); opacity: 1; }
            100% { transform: scale(0.2) translateY(150px) rotate(90deg); opacity: 0; }
        }
        .animate-drop { animation: dropIntoPot 0.8s ease-in forwards; pointer-events: none; z-index: 50; position: absolute; }

        @keyframes boiling {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-5px) scale(1.02); }
        }
        .animate-boil { animation: boiling 2s infinite ease-in-out; }

        @keyframes pop {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop { animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-150px) scale(1.5) rotate(90deg); opacity: 0; }
        }
        .star-particle {
            position: absolute;
            font-size: 3rem;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
            z-index: 60;
        }

        .word-slot {
            display: inline-block;
            min-width: 2rem;
            border-bottom: 4px solid #f59e0b;
            margin: 0 4px;
            text-align: center;
            height: 3.5rem;
            line-height: 3.5rem;
            color: #e5e7eb; 
        }
        .word-slot.filled {
            border-bottom: 4px solid transparent; 
            color: #d97706; 
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center relative">

    <!-- Menu Screen -->
    <div id="menu-screen" class="w-full h-full flex flex-col items-center justify-center p-4 z-20 absolute inset-0 bg-[#fff1f2]">
        <div class="text-[6rem] md:text-[8rem] drop-shadow-lg mb-2 animate-boil">👩‍🍳🍲</div>
        <h1 class="text-4xl md:text-6xl font-black text-rose-500 mb-8 text-center drop-shadow-md">
            Little Chef's Spelling Pot
        </h1>
        
        <div class="bg-white p-6 rounded-3xl w-full max-w-2xl border-4 border-rose-300 shadow-sm mb-8 text-center">
            <h2 class="text-2xl text-gray-700 font-bold mb-4">Today's Menu Mission:</h2>
            <ul class="text-lg text-gray-600 font-bold space-y-2 text-left w-fit mx-auto">
                <li>🔪 Find the letters and drop them in the pot!</li>
                <li>🔪 <span class="text-red-500">First letter is UPPERCASE, others are lowercase!</span></li>
                <li>🔪 Cook 3 foods to make a yummy meal!</li>
            </ul>
        </div>

        <button onclick="startGame()" class="btn-3d bg-rose-400 text-white text-4xl font-black py-6 px-16 rounded-[2rem] border-4 border-rose-500 hover:bg-rose-300">
            Let's Cook!
        </button>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="w-full h-full hidden flex-col relative max-w-3xl mx-auto">
        
        <!-- Top Info Bar -->
        <div class="w-full bg-white border-b-4 border-rose-200 p-2 md:p-4 z-10 shadow-sm flex justify-between items-center">
            <button onclick="showMenu()" class="btn-3d bg-gray-400 text-white text-sm md:text-lg font-bold py-2 px-4 rounded-xl border-b-4 border-gray-500 hover:bg-gray-300">
                🏠 Home
            </button>
            <div id="stage-display" class="text-lg md:text-xl font-black text-rose-500 bg-rose-100 px-4 py-2 rounded-full border-2 border-rose-300">
                Stage 1/3
            </div>
            <!-- Progress (3 Pots) -->
            <div id="food-progress" class="flex gap-2 text-2xl md:text-3xl bg-gray-100 py-1 px-3 rounded-full border-2 border-gray-200">
                <span id="prog-1" class="grayscale opacity-50 transition-all duration-500">🍲</span>
                <span id="prog-2" class="grayscale opacity-50 transition-all duration-500">🍲</span>
                <span id="prog-3" class="grayscale opacity-50 transition-all duration-500">🍲</span>
            </div>
        </div>

        <!-- Main Game Area -->
        <div class="flex-1 flex flex-col items-center justify-start pt-4 relative">
            
            <!-- Target Food Prompt -->
            <div class="bg-yellow-50 border-4 border-yellow-300 rounded-3xl p-4 md:p-6 mb-4 flex flex-col items-center shadow-md w-11/12 max-w-lg">
                <div id="target-emoji" class="text-[5rem] md:text-[6rem] drop-shadow-md mb-2">🍎</div>
                
                <!-- Word Display -->
                <div id="word-display" class="text-4xl md:text-5xl font-black flex justify-center flex-wrap tracking-widest">
                    <!-- JS Dynamic Generation -->
                </div>
            </div>

            <!-- Cooking Pot Area -->
            <div class="relative w-full flex justify-center mb-6 mt-auto">
                <div id="pot" class="text-[8rem] md:text-[10rem] drop-shadow-2xl animate-boil z-10 relative">
                    🍲
                    <!-- Hidden food preview in the pot -->
                    <div id="food-in-pot" class="absolute inset-0 flex items-center justify-center text-[4rem] opacity-0 transition-opacity duration-500 z-20 mb-8"></div>
                </div>
            </div>

            <!-- Letter Options Area -->
            <div id="options-container" class="w-full bg-white border-t-4 border-rose-200 p-4 pb-8 flex flex-wrap justify-center gap-2 md:gap-4 z-20 rounded-t-3xl shadow-[0_-10px_20px_rgba(0,0,0,0.05)]">
                <!-- JS Dynamic Generation -->
            </div>
        </div>

        <!-- Celebration Effects Container -->
        <div id="celebration-container" class="fixed inset-0 pointer-events-none flex items-center justify-center z-50"></div>

        <!-- Level Up Screen -->
        <div id="level-up-screen" class="fixed inset-0 bg-rose-500 bg-opacity-95 z-50 hidden flex-col items-center justify-center transition-opacity duration-500">
            <div class="bg-white p-8 md:p-12 rounded-[3rem] border-8 border-yellow-400 shadow-2xl flex flex-col items-center transform scale-0 transition-transform duration-500" id="level-up-box">
                <h2 id="level-up-title" class="text-4xl md:text-6xl font-black text-rose-500 mb-2 text-center drop-shadow-md animate-bounce">
                    Dish Complete!
                </h2>
                
                <!-- Dish Display -->
                <div id="dish-display" class="text-[8rem] md:text-[10rem] drop-shadow-xl my-4 animate-pop">🍛</div>
                
                <p id="level-up-msg" class="text-3xl font-bold text-gray-600 text-center mb-8">You made a delicious meal!</p>
                
                <button id="next-stage-btn" class="hidden btn-3d bg-orange-400 text-white text-3xl font-black py-4 px-10 rounded-3xl border-4 border-orange-500 hover:bg-orange-300">
                    Next Dish
                </button>
                <button id="finish-btn" onclick="showMenu()" class="hidden btn-3d bg-green-400 text-white text-3xl font-black py-4 px-10 rounded-3xl border-4 border-green-500 hover:bg-green-300">
                    Play Again
                </button>
            </div>
        </div>
    </div>

    <script>
        // Food Database
        const foodsData = [
            { word: 'Apple', emoji: '🍎' },
            { word: 'Bread', emoji: '🍞' },
            { word: 'Carrot', emoji: '🥕' },
            { word: 'Donut', emoji: '🍩' },
            { word: 'Egg', emoji: '🥚' },
            { word: 'Fish', emoji: '🐟' },
            { word: 'Grape', emoji: '🍇' },
            { word: 'Honey', emoji: '🍯' },
            { word: 'Juice', emoji: '🧃' },
            { word: 'Lemon', emoji: '🍋' },
            { word: 'Mango', emoji: '🥭' },
            { word: 'Onion', emoji: '🧅' },
            { word: 'Peach', emoji: '🍑' },
            { word: 'Steak', emoji: '🥩' }
        ];

        // Stage Rewards
        const stageDishes = [
            { emoji: '🍛', name: 'Curry Rice', msg: 'Yummy Curry Rice!' }, 
            { emoji: '🍝', name: 'Spaghetti', msg: 'Delicious Spaghetti!' }, 
            { emoji: '🍰', name: 'Big Cake', msg: 'Sweet Big Cake!' }     
        ];
        
        // Game State
        let currentStage = 1;
        const MAX_STAGE = 3;
        const FOODS_PER_STAGE = 3;
        
        let targetFoodsForStage = []; 
        let currentFoodIndex = 0;     
        
        let targetWord = "";          
        let currentSpelled = "";      
        
        let isProcessing = false;
        let bestEnglishVoice = null;

        // DOM Elements
        const menuScreen = document.getElementById('menu-screen');
        const gameScreen = document.getElementById('game-screen');
        const stageDisplay = document.getElementById('stage-display');
        const targetEmojiEl = document.getElementById('target-emoji');
        const wordDisplay = document.getElementById('word-display');
        const optionsContainer = document.getElementById('options-container');
        const pot = document.getElementById('pot');
        const foodInPot = document.getElementById('food-in-pot');
        const celebrationContainer = document.getElementById('celebration-container');
        
        const levelUpScreen = document.getElementById('level-up-screen');
        const levelUpBox = document.getElementById('level-up-box');
        const levelUpTitle = document.getElementById('level-up-title');
        const dishDisplay = document.getElementById('dish-display');
        const levelUpMsg = document.getElementById('level-up-msg');
        const nextStageBtn = document.getElementById('next-stage-btn');
        const finishBtn = document.getElementById('finish-btn');

        const buttonColors = ['bg-pink-400 border-pink-500', 'bg-blue-400 border-blue-500', 'bg-green-400 border-green-500', 'bg-orange-400 border-orange-500', 'bg-purple-400 border-purple-500', 'bg-teal-400 border-teal-500'];

        // Voice Init
        function loadVoices() {
            const voices = window.speechSynthesis.getVoices();
            if (voices.length === 0) return;
            const engPreferences = ['Google US English', 'Samantha', 'Karen', 'Tessa', 'Microsoft Zira'];
            for (let pref of engPreferences) {
                let match = voices.find(v => v.name.includes(pref) && v.lang.startsWith('en'));
                if (match) { bestEnglishVoice = match; break; }
            }
            if (!bestEnglishVoice) bestEnglishVoice = voices.find(v => v.lang.startsWith('en'));
        }
        window.speechSynthesis.onvoiceschanged = loadVoices;
        loadVoices();

        function showMenu() {
            gameScreen.classList.add('hidden');
            menuScreen.classList.remove('hidden');
            levelUpScreen.classList.add('hidden');
        }

        function startGame() {
            window.speechSynthesis.speak(new SpeechSynthesisUtterance('')); 
            currentStage = 1;
            
            menuScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            gameScreen.classList.add('flex');
            
            startStage();
        }

        function startStage() {
            isProcessing = false;
            currentFoodIndex = 0;
            
            let shuffled = [...foodsData].sort(() => 0.5 - Math.random());
            targetFoodsForStage = shuffled.slice(0, FOODS_PER_STAGE);
            
            stageDisplay.textContent = `Stage ${currentStage}/${MAX_STAGE}`;
            for(let i=1; i<=3; i++) {
                let el = document.getElementById(`prog-${i}`);
                el.classList.add('grayscale', 'opacity-50');
                el.textContent = '🍲';
            }
            
            levelUpScreen.classList.add('hidden');
            levelUpScreen.classList.remove('flex');
            levelUpBox.classList.remove('scale-100');
            
            loadFood();
        }

        function loadFood() {
            currentSpelled = "";
            let foodData = targetFoodsForStage[currentFoodIndex];
            targetWord = foodData.word;
            
            targetEmojiEl.textContent = foodData.emoji;
            targetEmojiEl.classList.remove('animate-pop');
            void targetEmojiEl.offsetWidth;
            targetEmojiEl.classList.add('animate-pop');

            setTimeout(() => speakText(`Let's cook ${targetWord}`), 300);
            
            updateWordDisplay();
            generateLetterOptions();
        }

        function updateWordDisplay() {
            wordDisplay.innerHTML = '';
            for (let i = 0; i < targetWord.length; i++) {
                const slot = document.createElement('span');
                if (i < currentSpelled.length) {
                    slot.className = 'word-slot filled animate-pop text-orange-600';
                    slot.textContent = currentSpelled[i];
                } else if (i === currentSpelled.length) {
                    slot.className = 'word-slot text-gray-400 animate-pulse font-bold';
                    slot.textContent = targetWord[i]; 
                } else {
                    slot.className = 'word-slot text-gray-200';
                    slot.textContent = targetWord[i]; 
                }
                wordDisplay.appendChild(slot);
            }
        }

        function generateLetterOptions() {
            optionsContainer.innerHTML = '';
            
            const nextLetterNeeded = targetWord[currentSpelled.length];
            const isUpperNeed = (currentSpelled.length === 0); 
            
            const optionCount = currentStage === 3 ? 8 : 6;
            
            let optionsPool = [nextLetterNeeded];
            
            const allUpper = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            const allLower = "abcdefghijklmnopqrstuvwxyz";
            const sourceStr = isUpperNeed ? allUpper : allLower; 
            
            let attempts = 0;
            while(optionsPool.length < optionCount && attempts < 100) {
                let randomLetter = sourceStr[Math.floor(Math.random() * sourceStr.length)];
                if (!optionsPool.includes(randomLetter)) {
                    optionsPool.push(randomLetter);
                }
                attempts++;
            }
            
            optionsPool.sort(() => 0.5 - Math.random());
            
            let availableColors = [...buttonColors, 'bg-indigo-400 border-indigo-500', 'bg-emerald-400 border-emerald-500'].sort(() => 0.5 - Math.random());
            
            optionsPool.forEach((letter, index) => {
                const colorClass = availableColors[index % availableColors.length];
                const btn = document.createElement('button');
                
                const widthClass = optionCount === 8 ? 'w-[22%] md:w-[18%]' : 'w-[28%] md:w-[22%]';
                
                btn.className = `btn-3d ${colorClass} text-white text-5xl md:text-6xl font-black py-4 md:py-6 rounded-2xl border-b-[6px] flex items-center justify-center ${widthClass}`;
                btn.textContent = letter;
                
                btn.onclick = (e) => handleLetterClick(letter, btn, e);
                optionsContainer.appendChild(btn);
            });
        }

        function handleLetterClick(letter, btnElement, event) {
            if (isProcessing) return;
            
            const nextLetterNeeded = targetWord[currentSpelled.length];
            
            if (letter === nextLetterNeeded) {
                isProcessing = true;
                playPlopSound();
                speakText(letter); 
                
                const flyLetter = document.createElement('div');
                flyLetter.textContent = letter;
                flyLetter.className = btnElement.className + " animate-drop";
                const rect = btnElement.getBoundingClientRect();
                flyLetter.style.left = `${rect.left}px`;
                flyLetter.style.top = `${rect.top}px`;
                flyLetter.style.width = `${rect.width}px`;
                flyLetter.style.height = `${rect.height}px`;
                document.body.appendChild(flyLetter);
                
                btnElement.disabled = true;
                currentSpelled += letter;
                
                setTimeout(() => {
                    flyLetter.remove(); 
                    updateWordDisplay();
                    
                    if (currentSpelled.length === targetWord.length) {
                        handleFoodComplete();
                    } else {
                        isProcessing = false;
                        generateLetterOptions();
                    }
                }, 800);

            } else {
                playBoingSound();
                btnElement.classList.remove('animate-shake');
                void btnElement.offsetWidth;
                btnElement.classList.add('animate-shake');
            }
        }

        function handleFoodComplete() {
            playCheerSound();
            speakText(`Got it! ${targetWord}`);
            
            foodInPot.textContent = targetFoodsForStage[currentFoodIndex].emoji;
            foodInPot.classList.remove('opacity-0', 'animate-pop');
            foodInPot.classList.add('animate-drop'); 
            
            showStars(pot);

            const progIcon = document.getElementById(`prog-${currentFoodIndex + 1}`);
            progIcon.classList.remove('grayscale', 'opacity-50');
            progIcon.textContent = targetFoodsForStage[currentFoodIndex].emoji;
            progIcon.classList.add('animate-pop');

            setTimeout(() => {
                foodInPot.classList.add('opacity-0');
                foodInPot.classList.remove('animate-drop');
                currentFoodIndex++;
                
                if (currentFoodIndex >= FOODS_PER_STAGE) {
                    handleStageComplete();
                } else {
                    isProcessing = false;
                    loadFood();
                }
            }, 1500);
        }

        function handleStageComplete() {
            playLevelUpSound();
            
            levelUpScreen.classList.remove('hidden');
            levelUpScreen.classList.add('flex');
            
            nextStageBtn.classList.add('hidden');
            finishBtn.classList.add('hidden');
            
            const dish = stageDishes[currentStage - 1];
            dishDisplay.textContent = dish.emoji;
            levelUpMsg.textContent = dish.msg;
            
            setTimeout(() => {
                levelUpBox.classList.remove('scale-0');
                levelUpBox.classList.add('scale-100');
            }, 100);

            if (currentStage >= MAX_STAGE) {
                levelUpTitle.textContent = "Dinner Time!";
                levelUpTitle.className = "text-5xl md:text-7xl font-black text-rose-500 mb-2 text-center drop-shadow-md animate-bounce";
                dishDisplay.innerHTML = `🍽️<br><span class="text-5xl">🍛🍝🍰</span>`; 
                levelUpMsg.textContent = "All dishes are ready! Let's eat!";
                
                finishBtn.classList.remove('hidden');
                
                setTimeout(() => speakText("Dinner is ready! You are a master chef!"), 500);
            } else {
                levelUpTitle.textContent = `Dish ${currentStage} Complete!`;
                levelUpTitle.className = "text-5xl md:text-7xl font-black text-orange-500 mb-2 text-center drop-shadow-md animate-bounce";
                
                nextStageBtn.classList.remove('hidden');
                
                nextStageBtn.onclick = () => {
                    currentStage++;
                    startStage();
                };

                setTimeout(() => speakText(`Yummy!`), 500);
            }
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                if (bestEnglishVoice) utterance.voice = bestEnglishVoice;
                utterance.rate = 0.85; 
                utterance.pitch = 1.2; 
                window.speechSynthesis.speak(utterance);
            }
        }

        function showStars(element) {
            const rect = element.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2 - 50; 
            
            for (let i = 0; i < 8; i++) {
                const star = document.createElement('div');
                star.textContent = '✨';
                star.className = 'star-particle text-yellow-400';
                star.style.left = `${centerX - 25}px`;
                star.style.top = `${centerY - 25}px`;
                const angle = (Math.random() * Math.PI * 2);
                const velocity = 80 + Math.random() * 80;
                star.style.setProperty('--tx', `${Math.sin(angle) * velocity}px`);
                star.style.animation = `floatUp 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards`;
                celebrationContainer.appendChild(star);
                setTimeout(() => star.remove(), 1200);
            }
        }

        function playPlopSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1000, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.2);
            } catch (e) {}
        }

        function playCheerSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.08, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.5);
            } catch (e) {}
        }

        function playBoingSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.05, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.3);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.3);
            } catch (e) {}
        }

        function playLevelUpSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const notes = [329.63, 392.00, 523.25, 659.25]; 
                notes.forEach((freq, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.15);
                    gain.gain.setValueAtTime(0, ctx.currentTime + i * 0.15);
                    gain.gain.linearRampToValueAtTime(0.1, ctx.currentTime + i * 0.15 + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.15 + 0.5);
                    osc.start(ctx.currentTime + i * 0.15);
                    osc.stop(ctx.currentTime + i * 0.15 + 0.5);
                });
            } catch (e) {}
        }
    </script>
</body>
</html>
